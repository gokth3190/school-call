<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>교무실 호출 시스템</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background: linear-gradient(135deg, #74b9ff, #0984e3); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .form-container { background: white; border-radius: 16px; padding: 35px 25px; width: 100%; max-width: 550px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        h2 { text-align: center; color: #2d3436; font-size: 26px; margin-bottom: 25px; font-weight: bold; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; color: #2d3436; margin-bottom: 8px; font-size: 15px; }
        input[type="text"], select, textarea { width: 100%; padding: 14px; border: 1px solid #b2bec3; border-radius: 8px; font-size: 16px; color: #2d3436; background-color: #fff; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: #0984e3; box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.1); }
        textarea { resize: none; height: 100px; }
        .btn-submit { width: 100%; padding: 16px; background-color: #0984e3; border: none; border-radius: 8px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn-submit:hover { background-color: #0773c5; }
        select:disabled { background-color: #dfe6e9; color: #b2bec3; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>교무실 호출 시스템</h2>
    
    <form id="callForm">
        <div class="form-group">
            <label>학년 / 반 / 번호</label>
            <input type="text" id="studentInfo" placeholder="예: 3학년 2반 15번" required>
        </div>
        
        <div class="form-group">
            <label>학생 이름</label>
            <input type="text" id="studentName" placeholder="홍길동" required>
        </div>
        
        <div class="form-group">
            <label>교무실 위치</label>
            <select id="officeLocation" required>
                <option value="">-- 교무실 위치를 선택하세요 --</option>
                <option value="1학년 교무실 (본관 3층)">1학년 교무실 (본관 3층)</option>
                <option value="2학년 교무실 (본관 2층)">2학년 교무실 (본관 2층)</option>
                <option value="3학년 교무실 (동국관 4층)">3학년 교무실 (동국관 4층)</option>
                <option value="본교무실 (본관 1층)">본교무실 (본관 1층)</option>
                <option value="학생안전부실 (동국관 2층)">학생안전부실 (동국관 2층)</option>
                <option value="기타 특별실 (상담/진로/보건 등)">기타 특별실 (상담/진로/보건 등)</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>호출할 선생님</label>
            <select id="teacherName" disabled required>
                <option value="">-- 교무실을 먼저 선택하세요 --</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>호출 사유</label>
            <textarea id="reason" placeholder="예: 수행평가 질문이 있습니다, 유인물 제출 등" required></textarea>
        </div>
        
        <button type="submit" class="btn-submit">선생님 호출하기</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = { apiKey: "AIzaSyAp6SY-nfj-epgvcc3QAHLlzAVBDx9hE6U", authDomain: "vibecoding-project-3ad00.firebaseapp.com", databaseURL: "https://vibecoding-project-3ad00-default-rtdb.firebaseio.com", projectId: "vibecoding-project-3ad00", storageBucket: "vibecoding-project-3ad00.firebasestorage.app", messagingSenderId: "836454758922", appId: "1:836454758922:web:98680d3f1c654bb3fd7df3", measurementId: "G-7ZW3KFHDS8" };
    const app = initializeApp(firebaseConfig); const database = getDatabase(app);

    // 각 교무실별 선생님 명단 (필요시 교사 성함을 학교에 맞게 수정하여 사용하세요)
    const teachersByOffice = {
        "1학년 교무실 (본관 3층)": ["김선생", "이선생", "박선생"],
        "2학년 교무실 (본관 2층)": ["최선생", "정선생", "강선생"],
        "3학년 교무실 (동국관 4층)": ["조선생", "윤선생", "장선생"],
        "본교무실 (본관 1층)": ["교감선생님", "부장선생님", "한선생"],
        "학생안전부실 (동국관 2층)": ["안전부장", "생활지도교사", "임선생"],
        "기타 특별실 (상담/진로/보건 등)": ["상담선생님", "진로선생님", "보건선생님"]
    };

    const officeSelect = document.getElementById('officeLocation');
    const teacherSelect = document.getElementById('teacherName');

    officeSelect.addEventListener('change', function() {
        const selectedOffice = this.value;
        teacherSelect.innerHTML = '<option value="">-- 선생님을 선택하세요 --</option>';
        if (selectedOffice && teachersByOffice[selectedOffice]) {
            teacherSelect.disabled = false;
            teachersByOffice[selectedOffice].forEach(teacher => {
                const option = document.createElement('option');
                option.value = teacher; option.textContent = teacher;
                teacherSelect.appendChild(option);
            });
        } else {
            teacherSelect.disabled = true;
            teacherSelect.innerHTML = '<option value="">-- 교무실을 먼저 선택하세요 --</option>';
        }
    });

    document.getElementById('callForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const now = new Date();
        const timestampStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        
        const callData = {
            studentInfo: document.getElementById('studentInfo').value,
            studentName: document.getElementById('studentName').value,
            officeLocation: officeSelect.value,
            teacherName: teacherSelect.value,
            reason: document.getElementById('reason').value,
            timestamp: timestampStr,
            status: "대기"
        };

        const newCallRef = push(ref(database, 'calls'));
        set(newCallRef, callData).then(() => {
            alert("선생님 호출이 완료되었습니다. 교무실 앞에서 잠시 대기해 주세요!");
            document.getElementById('callForm').reset();
            teacherSelect.disabled = true;
            teacherSelect.innerHTML = '<option value="">-- 교무실을 먼저 선택하세요 --</option>';
        }).catch((error) => {
            alert("호출 실패: " + error.message);
        });
    });
</script>
</body>
</html>
